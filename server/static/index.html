<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AnimaWorks">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="__AW_BASE__/manifest.json">
  <link rel="apple-touch-icon" href="__AW_BASE__/shared/icons/apple-touch-icon.png">
  <meta name="aw-base-path" content="__AW_BASE__">
  <title>AnimaWorks — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="__AW_BASE__/shared/favicon.svg">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/tokens.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/base.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/layout.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/sidebar-nav.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/dashboard.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/chat.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/chat-line.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/chat-call.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/chat-presence.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/chat-thinking.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/sidebar.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/activity.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/memory.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/history.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/avatar.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/assets.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/board.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/hub.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/task-board.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/responsive.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/chat-memory.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/voice.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/settings.css">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/styles/chat-mobile.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.44/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.44/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.7/lib/index.umd.js"></script>
  <!--
    Import Map: remap absolute "/shared/" imports to versioned URLs.
    __AW_VERSION__ / __AW_BASE__ are replaced server-side.
  -->
  <script type="importmap">
  {
    "imports": {
      "/shared/": "__AW_BASE__/_v/__AW_VERSION__/shared/"
    }
  }
  </script>
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <!-- Login form is rendered dynamically by login.js -->
  </div>

  <header class="app-header">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" data-i18n-aria-label="common.aria_menu">&#x2630;</button>
    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Toggle sidebar" title="Toggle sidebar" data-i18n-title="nav.sidebar_toggle" data-i18n-aria-label="nav.sidebar_toggle">
      <svg class="sidebar-collapse-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M15 6l-6 6 6 6" />
      </svg>
    </button>
    <h1 class="app-title">AnimaWorks</h1>
    <div class="header-spacer"></div>
    <div class="user-info" id="userInfo">
      <span class="user-label" id="currentUserLabel"></span>
      <button class="btn-logout" id="logoutBtn" data-i18n="ws.logout">Log out</button>
    </div>
    <div class="system-status" id="systemStatus">
      <span class="status-dot status-idle"></span>
      <span id="systemStatusText" data-i18n="status.connecting">Connecting...</span>
    </div>
  </header>

  <div class="app-shell">
    <!-- Mobile Nav Backdrop -->
    <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>
    <!-- Left Sidebar Navigation -->
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- One stroke icon set for every theme and display mode. Symbols read
           --nav-duo so the active item can tint its fill (duotone). -->
      <svg class="nav-sprite" aria-hidden="true" focusable="false">
        <symbol id="nav-i-home" viewBox="0 0 24 24">
          <rect x="3.5" y="3.5" width="7" height="7" rx="2.2" style="fill:currentColor;fill-opacity:var(--nav-duo,0)"/>
          <rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/>
          <circle cx="17" cy="17" r="3.6"/>
        </symbol>
        <symbol id="nav-i-chat" viewBox="0 0 24 24">
          <path d="M20.5 11.6a8 8 0 0 1-11.9 7l-4.6 1.4 1.4-4.3A8 8 0 1 1 20.5 11.6Z" style="fill:currentColor;fill-opacity:var(--nav-duo,0)"/>
          <path d="M8.6 10.4h6.8M8.6 13.6h4.4"/>
        </symbol>
        <symbol id="nav-i-board" viewBox="0 0 24 24">
          <rect x="3.5" y="3.5" width="17" height="17" rx="4.5" style="fill:currentColor;fill-opacity:var(--nav-duo,0)"/>
          <path d="M10.4 7.6 9.4 16.4M14.6 7.6l-1 8.8M7.6 10.2h9M7.2 13.8h9"/>
        </symbol>
        <symbol id="nav-i-hub" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="2.8" style="fill:currentColor;fill-opacity:var(--nav-duo,0)"/>
          <circle cx="12" cy="4.2" r="1.9"/>
          <circle cx="4.6" cy="17.6" r="1.9"/>
          <circle cx="19.4" cy="17.6" r="1.9"/>
          <path d="M12 6.1v3.1M6.3 16.4l3.4-2.4M17.7 16.4l-3.4-2.4"/>
        </symbol>
        <symbol id="nav-i-tasks" viewBox="0 0 24 24">
          <rect x="3.5" y="3.5" width="17" height="17" rx="4.5" style="fill:currentColor;fill-opacity:var(--nav-duo,0)"/>
          <path d="M8.5 7.8v7.4M12 7.8v4.4M15.5 7.8v8.6"/>
        </symbol>
        <symbol id="nav-i-activity" viewBox="0 0 24 24">
          <path d="M3 12.5h3.6l2.6-6.8 4.4 12.8 2.6-6h4.8"/>
        </symbol>
        <symbol id="nav-i-workspace" viewBox="0 0 24 24">
          <path d="M5 20V6.6A2.1 2.1 0 0 1 7.1 4.5h6.8A2.1 2.1 0 0 1 16 6.6V20" style="fill:currentColor;fill-opacity:var(--nav-duo,0)"/>
          <path d="M16 10h1.9A2.1 2.1 0 0 1 20 12.1V20M3 20h18M8.6 8.4h3.8M8.6 12h3.8M8.6 15.6h3.8"/>
        </symbol>
        <symbol id="nav-i-settings" viewBox="0 0 24 24">
          <path d="M4 7.5h8.5M18.5 7.5H20M4 16.5h1.5M11.5 16.5H20"/>
          <circle cx="15.5" cy="7.5" r="2.6" style="fill:currentColor;fill-opacity:var(--nav-duo,0)"/>
          <circle cx="8.5" cy="16.5" r="2.6" style="fill:currentColor;fill-opacity:var(--nav-duo,0)"/>
        </symbol>
        <symbol id="nav-i-external" viewBox="0 0 24 24">
          <path d="M8 16 16 8M9.5 8H16v6.5"/>
        </symbol>
      </svg>
      <ul class="nav-list">
        <li><a href="#/" class="nav-item" data-route="/">
          <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#nav-i-home"></use></svg>
          <span class="nav-label" data-i18n="nav.dashboard">Home</span></a></li>
        <li><a href="#/chat" class="nav-item active" data-route="/chat">
          <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#nav-i-chat"></use></svg>
          <span class="nav-label" data-i18n="nav.chat">Chat</span></a></li>
        <li><a href="#/board" class="nav-item" data-route="/board">
          <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#nav-i-board"></use></svg>
          <span class="nav-label" data-i18n="nav.board">Board</span></a></li>
        <li id="navHubItem" hidden><a href="#/hub" class="nav-item" data-route="/hub">
          <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#nav-i-hub"></use></svg>
          <span class="nav-label" data-i18n="nav.hub">External agents</span>
          <span class="nav-badge" id="navHubBadge" hidden></span></a></li>
        <li><a href="#/task-board" class="nav-item" data-route="/task-board">
          <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#nav-i-tasks"></use></svg>
          <span class="nav-label" data-i18n="nav.task_board">Tasks</span></a></li>
        <li><a href="#/activity" class="nav-item" data-route="/activity">
          <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#nav-i-activity"></use></svg>
          <span class="nav-label" data-i18n="nav.activity">Activity</span></a></li>
        <li class="nav-spacer" aria-hidden="true"></li>
        <li><a href="__AW_BASE__/workspace/" class="nav-item nav-external" target="_blank">
          <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#nav-i-workspace"></use></svg>
          <span class="nav-label" data-i18n="nav.workspace">Workspace</span>
          <svg class="nav-external-mark" aria-hidden="true" focusable="false"><use href="#nav-i-external"></use></svg></a></li>
        <li><a href="#/settings" class="nav-item" data-route="/settings">
          <svg class="nav-icon" aria-hidden="true" focusable="false"><use href="#nav-i-settings"></use></svg>
          <span class="nav-label" data-i18n="nav.settings">Settings</span></a></li>
      </ul>
    </nav>

    <!-- Main Content Area -->
    <div class="main-content" id="pageContent">
      <!-- Pages are rendered here by the router -->
    </div>
  </div>

  <script src="__AW_BASE__/vendor/lucide/lucide.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
  <script>
    const s = document.createElement('script');
    s.type = 'module';
    s.src = '__AW_BASE__/_v/__AW_VERSION__/modules/app.js';
    document.body.appendChild(s);
  </script>
</body>
</html>
