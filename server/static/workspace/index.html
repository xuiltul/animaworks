<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AnimaWorks Workspace</title>
  <meta name="aw-base-path" content="__AW_BASE__">
  <link rel="stylesheet" href="__AW_BASE__/styles/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.44/dist/katex.min.css">
  <link rel="stylesheet" href="style.css?v=20261109a">
  <link rel="stylesheet" href="__AW_BASE__/_v/__AW_VERSION__/battle/style.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/voice.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/chat.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/chat-line.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/chat-call.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/chat-presence.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/chat-thinking.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/chat-memory.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/activity.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/memory.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/history.css">
  <link rel="stylesheet" href="__AW_BASE__/styles/chat-mobile.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.44/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.7/lib/index.umd.js"></script>
  <link rel="icon" type="image/svg+xml" href="__AW_BASE__/shared/favicon.svg">
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.172.0",
      "three/addons/": "https://esm.sh/three@0.172.0/examples/jsm/",
      "/shared/": "__AW_BASE__/_v/__AW_VERSION__/shared/"
    }
  }
  </script>
</head>
<body>

  <!-- ── Login Overlay ────────────────── -->
  <div id="wsLogin"></div>
  <span id="currentUserLabel" hidden></span>

  <!-- ── Dashboard ────────────────────── -->
  <div id="wsDashboard" class="hidden">

    <!-- Header -->
    <header class="ws-header">
      <div class="ws-header-left">
        <span class="ws-title">AnimaWorks</span>
        <span class="ws-subtitle">Workspace</span>
      </div>
      <div class="ws-header-center" id="wsAnimaSelector"></div>
      <div class="ws-header-right">
        <div class="ws-view-toggle" id="wsViewToggle" role="group" title="Toggle view" data-i18n-title="ws.view_toggle_title">
          <button class="ws-view-toggle-option ws-view-toggle-office" type="button" data-view="office" aria-pressed="false" data-i18n="ws.view_office">🏢 Office</button>
          <button class="ws-view-toggle-option ws-view-toggle-org" type="button" data-view="org" aria-pressed="false" data-i18n="ws.view_dashboard">📊 Dashboard</button>
          <button class="ws-view-toggle-option ws-view-toggle-battle" type="button" data-view="battle" aria-pressed="false" data-i18n="ws.view_battle">⚔️ Battle</button>
        </div>
        <div class="ws-system-status" id="wsSystemStatus">
          <span class="status-dot status-offline"></span>
          <span class="status-text" data-i18n="ws.connecting">Connecting...</span>
        </div>
        <span class="ws-user-info" id="wsUserInfo"></span>
        <button class="ws-logout-btn" id="wsLogoutBtn" data-i18n="ws.logout">Log out</button>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="ws-layout">
      <!-- Embedded Chat conversation pane -->
      <section class="ws-chat-dock" id="wsChatDock" hidden></section>

      <!-- Draggable conversation/stage boundary -->
      <div class="ws-dock-resizer" id="wsDockResizer" role="separator"
        aria-orientation="vertical" aria-label="Resize conversation panel"
        aria-valuemin="340" aria-valuemax="760" tabindex="0" hidden></div>

      <div class="ws-stage" id="wsStage">
        <!-- Replaceable office renderer (always visible in office view) -->
        <div class="ws-office-panel" id="wsOfficePanel">
          <div class="ws-office-canvas" id="wsOfficeCanvas"></div>
        </div>

        <!-- Org Dashboard (alternative to the office) -->
        <div class="ws-org-panel hidden" id="wsOrgPanel"></div>

        <!-- Battle theater is mounted on demand by the workspace shell -->
        <div class="ws-battle-panel hidden" id="wsBattlePanel"></div>

        <!-- Presence/bust-up lives here while the Chat dock is embedded -->
        <div class="ws-presence-slot" id="wsPresenceSlot"></div>
      </div>
    </div>

    <!-- ── Reveal Overlay (Anima Birth Animation) ── -->
    <div id="wsRevealOverlay" class="ws-reveal-overlay" aria-hidden="true">
      <div class="ws-reveal-flash"></div>
      <div class="ws-reveal-content">
        <img class="ws-reveal-avatar" id="wsRevealAvatar" alt="" />
        <div class="ws-reveal-text" id="wsRevealText"></div>
      </div>
    </div>

  </div>

  <script src="__AW_BASE__/vendor/lucide/lucide.min.js"></script>
  <!-- ── Module Entry Point ───────────── -->
  <script type="module" src="modules/app.js?v=20261109a"></script>
</body>
</html>
