# Required Japanese descriptions for direct packages under core/.
core.activity: アクティビティログの記録、再生、タイムライン表示。
core.agent: LLM エージェントの実行、会話制御、エンジン連携。
core.anima: Digital Anima のライフサイクルと実行時オブジェクト。
core.auth: ユーザー認証、セッション、認証情報の管理。
core.channels: Slack、Discord、Chatwork の共通送信クライアントとトークン解決。
core.config: アプリケーション設定のスキーマ、読み込み、検証、移行。
core.enclave: 隔離された enclave モードの設定モデルと起動時セキュリティガード。
core.execution: ツール実行、コマンド実行、安全制御。
core.hub: 会社のタイムライン保存と既読位置。
core.i18n: 翻訳カタログと言語選択。
core.infra: ログ、データベース、キャッシュなどの基盤機能。
core.integrations: 外部サービス連携と animaworks-tool の実装。
core.lifecycle: anima の起動、停止、初期化のライフサイクル。
core.llm: LLM エラー分類、レート制御、リトライの共通機能。
core.mcp: Model Context Protocol サーバーとクライアント。
core.memory: 会話・エピソード記憶の保存、検索、整理。
core.messaging: anima 間および外部とのメッセージ配送。
core.migrations: 実行時データ形式の段階的な移行。
core.notification: 通知の生成と配送。
core.org: 会社、部署、役割などの組織モデル。
core.platform: 実行エンジンや OS ごとの差異を吸収する連携層。
core.phone: Twilio 電話チャネルの音声合成、通話状態、Webhook 管理。
core.prompt: システムプロンプトとコンテキストの構築。
core.skills: スキルの発見、読み込み、実行支援。
core.runtime: anima メインの実行時コンポーネント、プロセス間通信、タスク実行。
core.tasks: タスクの登録、状態管理、実行制御。
core.text: テキストのトークン見積もりと予算内切り詰め。
core.tooling: ツールのスキーマ、権限、実行基盤。
core.usage: LLM 利用量とコストの記録・集計。
core.voice: 音声入出力と音声対話。
