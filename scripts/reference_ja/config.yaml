# Japanese descriptions keyed by dotted config path.
version: 設定ファイル形式のバージョン。
setup_complete: 初期セットアップが完了したかどうか。
locale: システム全体で使用する既定の言語。
system: 実行環境、タイムゾーン、基本動作に関する設定。
credentials: 外部モデル・サービスの認証情報。
model_modes: モデル名パターンと実行モードの対応。
model_context_windows: モデルごとのコンテキスト長の互換設定。models.json の使用を推奨。
model_max_tokens: モデル名パターンごとの既定出力トークン数。
anima_defaults: 各 anima に適用するモデル・実行設定の既定値。
animas: anima ごとのモデル設定上書き。
consolidation: 記憶統合の動作とスケジュール。
helper_models: 補助LLM呼び出しごとのモデル、認証情報、明示的な代替候補、one-shot方針。
background_review: セッション後の非同期振り返りと人物像更新の設定。
rag: 検索拡張生成と記憶検索の設定。
gpu: GPU 利用とデバイス選択の設定。
memory: 記憶保存・検索の共通設定。
skills: スキル読み込みと管理の設定。
chatwork_tool: Chatwork ツールの権限設定。
prompt: システムプロンプトとプロンプト構築の設定。
priming: anima の起動時に読み込む情報の設定。
image_gen: 画像生成プロバイダーと既定パラメーター。
human_notification: 人間への通知方法と通知先。
hub: 会社のタイムラインとハブの設定。
interaction: anima 間の対話とメッセージ処理。
server: HTTP サーバー、認証、利用量制御の設定。
llm_rate_guard: LLM 呼び出し頻度と同時実行数の制御。
mcp: MCP サーバー接続とツール公開の設定。
external_messaging: Slack など外部メッセージング連携。
external_tasks: 外部タスクシステムとの連携。
github_webhook: GitHub webhook の受信と検証。
event_export: イベントデータのエクスポート。
background_task: バックグラウンド実行対象ツールの設定。
activity_log: 操作・活動ログの保存設定。
logging: ログレベル、出力先、機密情報のマスキング。
heartbeat: 定期的な heartbeat の実行設定。
voice: 音声入出力と音声プロバイダー。
phone: Twilio を利用した Anima 専用の電話会話と緊急通知。
housekeeping: 実行時データの定期整理。
inbox: anima の受信箱と通知表示。
local_llm: ローカル LLM エンドポイントとモデル設定。
workspaces: 名前付き workspace パスの対応。
github_identities: 会社 slug と GitHub アカウントの対応。
activity_level: 全体の活動頻度を調整する倍率。
activity_schedule: 時刻帯ごとの活動頻度。
icon_url_template: anima アイコン URL のテンプレート。
ui: Web UI の表示設定。
cli: CLI クライアントの設定。default_anima は引数なしの animaworks / animaworks chat で開く anima（空なら上司なしの有効な anima が1体だけの時それを使う）。
enclave: 隔離された enclave モードのサーバー設定。有効時は起動時にセキュリティガードを検査する。
enclave.enabled: この実行環境を隔離 enclave として起動する。
enclave.name: enclave gateway が返す識別名。
enclave.socket_path: gateway が待ち受ける Unix ドメインソケットのパス。
enclave.socket_group: gateway ソケットに設定する OS グループ。
enclave.entry_anima: enclave 内で質問を処理する entry anima。
enclave.allowed_peer_uids: gateway への接続を許可する OS ユーザー UID。
enclave.max_concurrency: gateway が同時に処理する質問の最大数。
enclave.request_timeout_s: 質問処理と gateway 応答のタイムアウト秒数。
enclave.allowed_llm_credentials: enclave 内の anima が利用できる認証情報名。
enclave.egress: 外部へ返す facts を処理する egress ステージ設定。
enclave.datasets: enclave 内の anima が参照できる JSONL データセット。
enclave.datasets.path: data directory 内にある JSONL ファイルの相対パス。
enclave.datasets.id_field: レコードを一意に取得するための ID フィールド。
enclave.datasets.searchable_fields: 部分一致検索を許可するフィールド。
enclaves: 外部の enclave インスタンスに接続するクライアント側の設定。
enclaves.socket_path: 接続先 enclave の Unix ドメインソケット。
enclaves.allowed_animas: その enclave への質問を許可する本体側 anima。
enclaves.timeout_s: enclave gateway への接続タイムアウト秒数。
status_json.background_model: heartbeat や cron で使うモデル上書き。
status_json.credential: anima に関連付ける認証情報名。
status_json.execution_mode: anima の実行モード。
status_json.fallback_model: 主モデル失敗時に使う代替モデル。
status_json.heartbeat_enabled: 定期 heartbeat の有効・無効。
status_json.max_tokens: モデルの最大出力トークン数。
status_json.model: anima の主モデル。
status_json.supervisor: 上位 supervisor anima の名前。
status_json_extra:
  role: anima の役割テンプレート。
  enabled: anima の有効・無効。
  company: 所属する会社。
  department: 所属する部署。
  needs_user_input: ユーザー入力が必要な状態かどうか。
  bootstrap_state: 初期化処理の状態。
